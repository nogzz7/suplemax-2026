<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background: #6d6969;
      overflow: hidden;
    }
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      object-fit: contain;
      object-position: center center;
      z-index: 0;
    }
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px calc(14px + env(safe-area-inset-top, 0px)) 20px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
    }
    .top-nav-logo {
      width: 134px;
      height: 134px;
      border-radius: 8px;
      background: #ffffff00;
      object-fit: contain;
      padding: 3px;
      flex-shrink: 0;
    }
    .top-nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .top-nav-links a {
      color: #ff0000;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
      white-space: nowrap;
    }
    .top-nav-links a:hover {
      opacity: 1;
      color: #F5C542;
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom, 0px));
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      color: #F5C542;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(245,197,66,0.4);
      margin-bottom: 18px;
      text-align: center;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 340px;
    }
    .btn-home, .btn-whats {
      flex: 1 1 140px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(211,47,47,0.4);
      transition: transform 0.2s;
      white-space: nowrap;
    }
    .btn-whats {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(37,211,102,0.4);
      transition: transform 0.2s;
      white-space: nowrap;
    }
    .btn-home:hover, .btn-whats:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 380px) {
      .btn-row { flex-direction: column; max-width: 260px; }
      .btn-home, .btn-whats { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
  <video class="video-bg" id="bgVideo" autoplay muted playsinline>

  <div class="top-nav">
    <img src="https://i.ibb.co/SwR5Qmp1/l2.png" alt="SUPLEMAX" class="top-nav-logo">

</body>
</html>
