<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada - SUPLEMAX</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://i.ibb.co/SwR5Qmp1/l2.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a1a1a 0%, #000000 70%);
      color: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* CABEÇALHO */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }
    .top-nav-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #fff;
      object-fit: contain;
      padding: 4px;
      flex-shrink: 0;
    }
    .top-nav-links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .top-nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .top-nav-links a:hover {
      color: #F5C542;
    }

    /* CONTEÚDO CENTRAL */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px calc(40px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
    }
    .code {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(56px, 12vw, 96px);
      line-height: 1;
      background: linear-gradient(90deg, #B8860B 0%, #F5C542 50%, #B8860B 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 4px;
    }
    .title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 3.5vw, 24px);
      margin-bottom: 28px;
    }

    .video-card {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,197,66,0.25);
      margin-bottom: 28px;
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      max-width: 420px;
      margin-bottom: 28px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 340px;
    }
    .btn-home, .btn-whats {
      flex: 1 1 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 9999px;
      white-space: nowrap;
      transition: transform 0.2s;
    }
    .btn-home {
      background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
      color: #fff;
      box-shadow: 0 10px 25px rgba(211,47,47,0.35);
    }
    .btn-whats {
      background: #25D366;
      color: #fff;
      box-shadow: 0 10px 25px rgba(37,211,102,0.35);
    }
    .btn-home:hover, .btn-whats:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 380px) {
      .btn-row { flex-direction: column; max-width: 260px; }
      .btn-home, .btn-whats { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <img src="https://i.ibb.co/SwR5Qmp1/l2.png" alt="SUPLEMAX" class="top-nav-logo">
    <nav class="top-nav-links">
      <a href="/">Início</a>
      <a href="/">Sobre Nós</a>
      <a href="https://wa.me/5533998253024" target="_blank" rel="noopener">Suporte</a>
    </nav>
  </div>

  <div class="content">
    <div class="code">404</div>
    <div class="title">Essa página fugiu do treino</div>

    <div class="video-card">
      <video autoplay muted playsinline>
        <source src="/images/404video.mp4" type="video/mp4">
      </video>
    </div>

    <p class="subtitle">A página que você procura não existe ou foi movida. Mas relaxa, os suplementos continuam todos lá na loja.</p>

    <div class="btn-row">
      <a href="/" class="btn-home"><i class="fas fa-arrow-left"></i> Voltar para a loja</a>
      <a href="https://wa.me/5533998253024" target="_blank" rel="noopener" class="btn-whats"><i class="fab fa-whatsapp"></i> Falar no WhatsApp</a>
    </div>
  </div>
</body>
</html>
